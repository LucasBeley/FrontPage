name: Deploy App

on:
  # Enables manually triggering of Workflow with file synchronization option
  workflow_dispatch:
    inputs:
      sync:
        description: 'File synchronization'
        required: true
        default: 'full'
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
            npm install
      - name: Build app
        run: |
            npm run build
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
            name: build
            path: |
                build
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download static artifacts
        uses: actions/download-artifact@v4
        with:
            name: build
            path: build
      - name: Deploy to host via FTP
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: 'sftp'
          remote-host: ${{ secrets.SSH_HOST }}
          remote-user: ${{ secrets.SSH_USER }}
          remote-password: ${{ secrets.SSH_KEY }}
          remote-path: '/var/www/frontpage/'
          local-path: build/
